<!-- ============================================================================
     全站顶部导航栏 —— ★ 唯一真源（Single Source of Truth）

     改这一个文件，然后运行  ./deploy.sh
     它会自动同步到所有 6 个页面（构建期注入，见 _build/sync-nav.py）。

     ── 占位符 ──────────────────────────────────────────────────────
       {P}            相对路径前缀：根页面 = 空，子页面 = ../
       {ON_HOME}      这三项里，当前页面对应的那一个会被替换成
       {ON_PRODUCTS}  class="on"（高亮），其余替换成空字符串
       {ON_THANKS}

     ── 加/删导航项就改下面三行 ────────────────────────────────────
     ============================================================================ -->
<a{ON_HOME} href="{P}">首页</a>
<a{ON_PRODUCTS} href="{P}products/">产品</a>
<a{ON_THANKS} href="{P}thanks/">鸣谢</a>
